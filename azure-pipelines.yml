trigger:
  - main

pool:
  name: Default

variables:
  POSTGRES_DB: mrp_db
  POSTGRES_USER: mrp_user

  # Local test database for the Build and Test stage
  DB_URL: jdbc:postgresql://localhost:5432/mrp_db
  DB_USERNAME: mrp_user

  # Local deployment folder on the self-hosted agent
  DEPLOY_DIR: 'C:\mrp-deployment'

  # Azure deployment configuration
  AZURE_RESOURCE_GROUP: devops-project
  AZURE_WEBAPP_NAME: mrp-devops-api-berdan
  AZURE_DB_HOST: mrp-postgres-berdan.postgres.database.azure.com
  AZURE_DB_NAME: mrp_db
  AZURE_DB_USERNAME: mrp_user

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Build, Test and Publish Artifact'
        steps:
          - checkout: self

          - task: AzureKeyVault@2
            displayName: 'Load DB password from Azure Key Vault'
            inputs:
              azureSubscription: 'sc-azure-keyvault-mrp'
              KeyVaultName: 'mrp-devops'
              SecretsFilter: 'DB-PASSWORD'
              RunAsPreJob: false

          - task: PowerShell@2
            displayName: 'Start PostgreSQL Database for Tests'
            inputs:
              targetType: 'inline'
              script: |
                docker compose down
                docker compose up -d
                Start-Sleep -Seconds 20
                docker ps
            env:
              POSTGRES_DB: $(POSTGRES_DB)
              POSTGRES_USER: $(POSTGRES_USER)
              POSTGRES_PASSWORD: $(DB-PASSWORD)

          - task: Maven@3
            displayName: 'Build and Test with Maven'
            inputs:
              mavenPomFile: 'pom.xml'
              mavenOptions: '-Xmx3072m'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.21'
              jdkArchitectureOption: 'x64'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              goals: 'clean package'
            env:
              DB_URL: $(DB_URL)
              DB_USERNAME: $(DB_USERNAME)
              DB_PASSWORD: $(DB-PASSWORD)

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Executable JAR Artifact'
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)\target\Media-Ratings-Platform-1.0-SNAPSHOT.jar'
              artifact: 'media-ratings-platform-jar'
              publishLocation: 'pipeline'

  - stage: ReleaseLocal
    displayName: 'Release to Local Deployment Environment'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployLocal
        displayName: 'Deploy Executable JAR Locally'
        steps:
          - download: current
            artifact: media-ratings-platform-jar

          - task: PowerShell@2
            displayName: 'Deploy JAR to Local Deployment Folder'
            inputs:
              targetType: 'inline'
              script: |
                $deployDir = "$(DEPLOY_DIR)"
                $artifactPath = "$(Pipeline.Workspace)\media-ratings-platform-jar\Media-Ratings-Platform-1.0-SNAPSHOT.jar"
                $targetJar = "$deployDir\Media-Ratings-Platform.jar"
                $startScript = "$deployDir\start-mrp.ps1"

                if (!(Test-Path $deployDir)) {
                  New-Item -ItemType Directory -Path $deployDir | Out-Null
                }

                Copy-Item $artifactPath $targetJar -Force

                @"
                `$env:DB_URL = "jdbc:postgresql://localhost:5432/mrp_db"
                `$env:DB_USERNAME = "mrp_user"
                `$env:DB_PASSWORD = "<set-secret-before-start>"

                java -jar "$targetJar"
                "@ | Set-Content -Path $startScript -Encoding UTF8

                Write-Host "Local deployment completed successfully."
                Write-Host "JAR deployed to: $targetJar"
                Write-Host "Start script created at: $startScript"

                Get-ChildItem $deployDir

  - stage: DeployAzure
    displayName: 'Deploy to Azure App Service'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployToAzureAppService
        displayName: 'Deploy Executable JAR to Azure App Service'
        steps:
          - download: current
            artifact: media-ratings-platform-jar

          - task: AzureKeyVault@2
            displayName: 'Load DB password from Azure Key Vault'
            inputs:
              azureSubscription: 'sc-azure-keyvault-mrp'
              KeyVaultName: 'mrp-devops'
              SecretsFilter: 'DB-PASSWORD'
              RunAsPreJob: false

          - task: AzureCLI@2
            displayName: 'Configure Azure App Service and deploy JAR'
            inputs:
              azureSubscription: 'sc-azure-keyvault-mrp'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $resourceGroup = "$(AZURE_RESOURCE_GROUP)"
                $webAppName = "$(AZURE_WEBAPP_NAME)"
                $dbHost = "$(AZURE_DB_HOST)"
                $dbName = "$(AZURE_DB_NAME)"
                $dbUser = "$(AZURE_DB_USERNAME)"
                $dbPassword = "$(DB-PASSWORD)"

                $artifactPath = "$(Pipeline.Workspace)\media-ratings-platform-jar\Media-Ratings-Platform-1.0-SNAPSHOT.jar"
                $deployJar = "$(Pipeline.Workspace)\app.jar"

                Copy-Item $artifactPath $deployJar -Force

                Write-Host "Configuring Azure App Service app settings..."

                az webapp config appsettings set `
                  --resource-group $resourceGroup `
                  --name $webAppName `
                  --settings `
                    DB_URL="jdbc:postgresql://$dbHost:5432/$dbName?sslmode=require" `
                    DB_USERNAME="$dbUser" `
                    DB_PASSWORD="$dbPassword" `
                    PORT="8080" `
                    WEBSITES_PORT="8080"

                Write-Host "Configuring Azure App Service startup command..."

                az webapp config set `
                  --resource-group $resourceGroup `
                  --name $webAppName `
                  --startup-file "java -jar /home/site/wwwroot/app.jar"

                Write-Host "Deploying JAR to Azure App Service..."

                az webapp deploy `
                  --resource-group $resourceGroup `
                  --name $webAppName `
                  --src-path $deployJar `
                  --type jar `
                  --track-status false
                
                $defaultHostName = az webapp show `
                  --resource-group $resourceGroup `
                  --name $webAppName `
                  --query defaultHostName `
                  --output tsv
                
                Write-Host "Azure deployment completed successfully."
                Write-Host "Application URL: https://$defaultHostName/api/health"
